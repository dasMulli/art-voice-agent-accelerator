name: StandbyConfirmationAgent
description: Confirms an existing service desk ticket during an outbound call.

greeting: "Hello. I'm calling to confirm a service desk ticket."
return_greeting: "Welcome back. Let's continue confirming the service desk ticket."

voice:
  name: en-US-ShimmerTurboMultilingualNeural
  type: azure-standard
  rate: "+0%"

voicelive_model:
  deployment_id: gpt-realtime
  temperature: 0.5
  max_tokens: 180

cascade_model:
  deployment_id: gpt-4o
  temperature: 0.5
  max_tokens: 140

session:
  modalities: [TEXT, AUDIO]
  input_audio_format: PCM16
  output_audio_format: PCM16
  input_audio_transcription_settings:
    model: gpt-4o-transcribe
    language: en-US
  turn_detection:
    type: azure_semantic_vad
    threshold: 0.5
    prefix_padding_ms: 240
    silence_duration_ms: 700
  tool_choice: auto

speech:
  recognition:
    language: en-US
  synthesis:
    voice_name: en-US-ShimmerTurboMultilingualNeural
  vad:
    threshold: 0.02
    silence_duration_ms: 700
    prefix_padding_ms: 200

tools:
  - record_service_desk_confirmation

prompts:
  path: prompt.jinja
