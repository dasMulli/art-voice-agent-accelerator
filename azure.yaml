# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: art-voice-agent-accelerator
metadata:
  template: azd-init@1.15.1

infra:
  provider: terraform
  path: ./infra/terraform

services:
  rtaudio-client:
    project: apps/artagent/frontend
    host: containerapp
    language: js
    docker:
      path: ./Dockerfile
      context: .
      platform: linux/amd64
      remoteBuild: true
      
  rtaudio-server:
    project: .
    host: containerapp
    language: docker
    docker:
      path: ./apps/artagent/backend/Dockerfile
      context: .
      platform: linux/amd64
      remoteBuild: true

  cardapi-mcp:
    project: .
    host: containerapp
    language: python
    docker:
      path: ./apps/cardapi/Dockerfile.mcp
      context: .
      platform: linux/amd64
      remoteBuild: true


hooks:
  preprovision:
    windows:
      shell: pwsh
      run: ./devops/scripts/azd/invoke-bash-hook.ps1 ./devops/scripts/azd/preprovision.sh terraform
      interactive: true
      continueOnError: false
    posix:
      shell: sh
      run: devops/scripts/azd/preprovision.sh terraform
      interactive: true
      continueOnError: false

  postprovision:
    windows:
      shell: pwsh
      run: ./devops/scripts/azd/invoke-bash-hook.ps1 ./devops/scripts/azd/postprovision.sh
      interactive: true
      continueOnError: false
    posix:
      shell: sh
      run: devops/scripts/azd/postprovision.sh
      interactive: true
      continueOnError: false

  postdown:
    windows:
      shell: pwsh
      run: ./devops/scripts/azd/invoke-bash-hook.ps1 ./devops/scripts/azd/postdown.sh
      interactive: true
      continueOnError: true
    posix:
      shell: sh
      run: devops/scripts/azd/postdown.sh
      interactive: true
      continueOnError: true
